services:
  backend:
    build:
      context: ./Backend
    container_name: smart-college-backend

    ports:
      - "8000:8000"

    env_file:
      - ./Backend/.env

    volumes:
      - ./Backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
    container_name: smart-college-frontend

    ports:
      - "3000:3000"

    env_file:
      - ./Frontend/.env

    volumes:
      - ./Frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
